[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/malshatti44/warshaa"

[workspace.dependencies]
# internal: add each crate here as `warsha-<name> = { path = "crates/<name>" }`
warsha-print = { path = "crates/print" }
warsha-ui = { path = "crates/ui" }
egui = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
