[package]
name = "watheeq-automation"
description = "Agent control for Watheeq: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
watheeq-engine = { workspace = true }
watheeq-cos = { workspace = true }
watheeq-render = { workspace = true }
watheeq-organize = { workspace = true }
watheeq-platform = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
png = "0.18"
base64 = { version = "0.22", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
watheeq-fonts = { workspace = true }
flate2.workspace = true
watheeq-model = { workspace = true }
watheeq-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
