[package]
name = "watheeq-cli"
description = "Watheeq command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "watheeq-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
watheeq-render = { workspace = true }
serde_json = { workspace = true }
watheeq-engine = { workspace = true }
watheeq-audit = { workspace = true }
watheeq-cos = { workspace = true }
watheeq-automation = { workspace = true }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for watheeq-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`watheeq-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["watheeq-automation/mcp"]
