[package]
name = "nasaq-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nasaq text composition: paragraph composer (Knuth–Plass), hyphenation, justification, columns, threading, wrap"

[lints]
workspace = true

[dependencies]
unicode-bidi = { workspace = true }
unicode-bidi-mirroring = { workspace = true }
nasaq-geom = { workspace = true }
nasaq-color = { workspace = true }
nasaq-doc = { workspace = true }
nasaq-fonts = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
miniz_oxide = "0.8"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "portuguese", "spanish"] }

[dev-dependencies]
nasaq-fonts = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
