[package]
name = "monteer-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
monteer-time = { workspace = true }
monteer-color = { workspace = true }
monteer-frame = { workspace = true }
monteer-media = { workspace = true }
monteer-avi = { workspace = true }
monteer-isobmff = { workspace = true }
monteer-matroska = { workspace = true }
monteer-mxf = { workspace = true }
monteer-mpegts = { workspace = true }
monteer-mpeg2v = { workspace = true }
monteer-ac3 = { workspace = true }
monteer-mpa = { workspace = true }
monteer-ogg = { workspace = true }
monteer-bitstream = { workspace = true }
monteer-h264 = { workspace = true }
monteer-hevc = { workspace = true }
monteer-vp8 = { workspace = true }
monteer-vp9 = { workspace = true }
monteer-prores = { workspace = true }
monteer-dnx = { workspace = true }
monteer-av1 = { workspace = true }
monteer-apv = { workspace = true }
monteer-aac = { workspace = true }
monteer-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
monteer-testkit = { workspace = true }
serde_json = { workspace = true }
