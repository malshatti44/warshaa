[package]
name = "monteer-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
monteer-time = { workspace = true }
monteer-frame = { workspace = true }
monteer-color = { workspace = true }
monteer-media = { workspace = true }
monteer-project = { workspace = true }
monteer-render = { workspace = true }
monteer-audio-dsp = { workspace = true }
monteer-geom = { workspace = true }
monteer-text = { workspace = true }
monteer-isobmff = { workspace = true }
monteer-prores = { workspace = true }
monteer-dnx = { workspace = true }
monteer-apv = { workspace = true }
monteer-mxf = { workspace = true }
monteer-aac = { workspace = true }
monteer-flac = { workspace = true }
monteer-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
monteer-testkit = { workspace = true }
monteer-codecs = { workspace = true }
