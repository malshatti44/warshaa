[package]
name = "mukhattat-engine"
description = "Mukhattat engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mukhattat-geom = { workspace = true }
mukhattat-color = { workspace = true }
mukhattat-doc = { workspace = true }
mukhattat-dxf = { workspace = true }
mukhattat-constraints = { workspace = true }
mukhattat-fonts = { workspace = true }
mukhattat-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
mukhattat-io = { workspace = true }
