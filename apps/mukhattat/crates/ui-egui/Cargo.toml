[package]
name = "mukhattat-ui-egui"
description = "Mukhattat user interface (egui): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
warsha-ui = { workspace = true }
mukhattat-geom = { workspace = true }
mukhattat-color = { workspace = true }
mukhattat-doc = { workspace = true }
mukhattat-render = { workspace = true }
mukhattat-engine = { workspace = true }
egui = { workspace = true }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Warsha (ورشة): the in-app AI assistant panel.
warsha-assistant = { path = "../../../../shared/assistant" }
