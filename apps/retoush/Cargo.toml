[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/retoush", "apps/retoush-cli", "xtask"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
warsha-ui = { path = "../../shared/warsha-libs/crates/ui", features = ["serde"] }
# internal
retoush-geom = { path = "crates/geom" }
retoush-color = { path = "crates/color" }
retoush-cms = { path = "crates/cms" }
retoush-raster = { path = "crates/raster" }
retoush-doc = { path = "crates/doc" }
retoush-ops = { path = "crates/ops" }
retoush-psd = { path = "crates/psd" }
retoush-codecs = { path = "crates/codecs" }
retoush-raw = { path = "crates/raw" }
retoush-affinity = { path = "crates/affinity" }
retoush-compose = { path = "crates/compose" }
retoush-gpu = { path = "crates/gpu" }
retoush-paint = { path = "crates/paint" }
retoush-algo = { path = "crates/algo" }
retoush-io = { path = "crates/io" }
retoush-text = { path = "crates/text" }
retoush-vector = { path = "crates/vector" }
retoush-format = { path = "crates/format" }
retoush-automation = { path = "crates/automation" }
retoush-plugins = { path = "crates/plugins" }
retoush-engine = { path = "crates/engine" }
retoush-ui-egui = { path = "crates/ui-egui" }
retoush-testkit = { path = "crates/testkit" }
retoush-tablet = { path = "crates/tablet" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the ~260 test binaries (#2204). CI sets the same through
# CARGO_PROFILE_DEV_DEBUG. To inspect locals in a debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/retoush-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for the UI, command, and I/O
# shells, and "s" for other crates except pixel processing, which keeps opt-level 3. panic
# stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"` is for
# the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Keep the browser shell compact as shared panel controls grow. Pixel-processing crates below
# retain their speed-oriented optimization level.
[profile.wasm-release.package.retoush-ui-egui]
opt-level = "z"

# Keep browser command dispatch, import/export glue, and the entry point compact. Native
# builds and the speed-oriented pixel-processing overrides below retain their settings.
[profile.wasm-release.package.retoush-engine]
opt-level = "z"
[profile.wasm-release.package.retoush-io]
opt-level = "z"
[profile.wasm-release.package.retoush-web]
opt-level = "z"

[profile.wasm-release.package.retoush-raster]
opt-level = 3
[profile.wasm-release.package.retoush-color]
opt-level = 3
[profile.wasm-release.package.retoush-cms]
opt-level = 3
[profile.wasm-release.package.retoush-compose]
opt-level = 3
[profile.wasm-release.package.retoush-algo]
opt-level = 3
[profile.wasm-release.package.retoush-paint]
opt-level = 3

# Arabic builds (ورشة): right-to-left rows and an Arabic fallback font in egui text.
[patch.crates-io]
epaint = { path = "../../shared/epaint" }
# Window titles with the Arabic app names, and the label hook (shared/egui).
egui = { path = "../../shared/egui" }
