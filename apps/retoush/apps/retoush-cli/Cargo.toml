[package]
name = "retoush-cli"
description = "Headless Retoush: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional retoush-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["retoush-codecs/heif"]

[lints]
workspace = true

[lib]
name = "retoush_cli"
path = "src/lib.rs"

[[bin]]
name = "retoush-cli"
path = "src/main.rs"

[dependencies]
retoush-automation = { path = "../../crates/automation" }
retoush-engine = { workspace = true }
retoush-io = { workspace = true }
retoush-format = { path = "../../crates/format" }
retoush-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for retoush-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

