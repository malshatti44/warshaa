[package]
name = "retoush-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
retoush-geom = { workspace = true }
retoush-color = { workspace = true }
retoush-cms = { workspace = true }
retoush-raster = { workspace = true }
retoush-doc = { workspace = true }
retoush-ops = { workspace = true }
retoush-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
retoush-paint = { workspace = true }
retoush-algo = { workspace = true }
retoush-text = { workspace = true }
retoush-vector = { workspace = true }
retoush-io = { workspace = true }
retoush-psd = { workspace = true }
retoush-format = { workspace = true }
retoush-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
retoush-codecs = { workspace = true }
flate2 = { workspace = true }
# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through retoush-ui-egui and usvg.
roxmltree = "0.20"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[dev-dependencies]
retoush-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
retoush-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
