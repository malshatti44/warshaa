[package]
name = "tayf-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tayf GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
tayf-denoise = { workspace = true, optional = true }
tayf-geom = { workspace = true }
tayf-color = { workspace = true }
tayf-raster = { workspace = true }
tayf-develop = { workspace = true }
tayf-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:tayf-denoise", "tayf-denoise/runtime"]

[dev-dependencies]
tayf-scenes = { workspace = true }
tayf-raw = { workspace = true }
