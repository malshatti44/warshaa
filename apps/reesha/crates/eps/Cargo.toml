[package]
name = "reesha-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reesha Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
reesha-geom = { workspace = true }
reesha-color = { workspace = true }
reesha-doc = { workspace = true }
reesha-effects = { workspace = true }
reesha-brush = { workspace = true }
reesha-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
reesha-metafile = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
reesha-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
reesha-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }

[dev-dependencies]
reesha-testkit = { workspace = true }
