[package]
name = "monteer-ui-egui"
description = "The Monteer egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
monteer-time = { workspace = true }
monteer-geom = { workspace = true }
monteer-color = { workspace = true }
monteer-frame = { workspace = true }
monteer-media = { workspace = true }
monteer-project = { workspace = true }
monteer-edit = { workspace = true }
monteer-render = { workspace = true }
monteer-text = { workspace = true }
monteer-audio-dsp = { workspace = true }
monteer-engine = { workspace = true }
monteer-gpu = { workspace = true }
monteer-scopes = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = "1"
# Warsha wordmark (PNG) for the About dialog and Home screen.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[dev-dependencies]
pollster = "0.4"
monteer-codecs = { workspace = true }
monteer-interchange = { workspace = true }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
