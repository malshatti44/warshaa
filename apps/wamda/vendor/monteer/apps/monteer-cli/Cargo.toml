[package]
name = "monteer-cli"
description = "Monteer headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "monteer-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["monteer-engine/whisper", "monteer-engine/speech-download"]

[dependencies]
monteer-engine = { workspace = true }
monteer-media = { workspace = true }
monteer-codecs = { workspace = true }
monteer-mxf = { workspace = true }
monteer-mpegts = { workspace = true }
monteer-ogg = { workspace = true }
monteer-time = { workspace = true }
monteer-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
