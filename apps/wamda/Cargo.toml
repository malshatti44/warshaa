[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]
# Libraries vendored from Monteer form their own workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/malshatti44/warshaa"

[workspace.dependencies]
# internal
wamda-time = { path = "crates/time" }
wamda-geom = { path = "crates/geom" }
wamda-color = { path = "crates/color" }
wamda-raster = { path = "crates/raster" }
wamda-path = { path = "crates/path" }
wamda-keyframe = { path = "crates/keyframe" }
wamda-project = { path = "crates/project" }
wamda-text = { path = "crates/text" }
wamda-effects = { path = "crates/effects" }
wamda-track = { path = "crates/track" }
wamda-segment = { path = "crates/segment" }
wamda-model = { path = "crates/model" }
wamda-render = { path = "crates/render" }
wamda-gpu = { path = "crates/gpu" }
wamda-media = { path = "crates/media" }
wamda-export = { path = "crates/export" }
wamda-expr = { path = "crates/expr" }
wamda-lottie = { path = "crates/lottie" }
wamda-interchange = { path = "crates/interchange" }
wamda-pdf = { path = "crates/pdf" }
wamda-psd = { path = "crates/psd" }
wamda-vp9enc = { path = "crates/vp9enc" }
wamda-svg = { path = "crates/svg" }
wamda-engine = { path = "crates/engine" }
wamda-host = { path = "crates/host" }
wamda-ui-egui = { path = "crates/ui-egui" }
wamda-automation = { path = "crates/automation" }
wamda-opusenc = { path = "crates/opusenc" }
wamda-script = { path = "crates/script" }
wamda-hevcenc = { path = "crates/hevcenc" }
wamda-av1enc = { path = "crates/av1enc" }
wamda-plugin = { path = "crates/plugin" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# media codecs + containers: Monteer's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
monteer-codecs = { path = "vendor/monteer/crates/codecs" }
monteer-media = { path = "vendor/monteer/crates/media" }
monteer-frame = { path = "vendor/monteer/crates/frame" }
monteer-color = { path = "vendor/monteer/crates/color" }
monteer-time = { path = "vendor/monteer/crates/time" }
# encoders + muxer (crates/export)
monteer-h264enc = { path = "vendor/monteer/crates/h264enc" }
monteer-prores = { path = "vendor/monteer/crates/prores" }
monteer-aac = { path = "vendor/monteer/crates/aac" }
monteer-isobmff = { path = "vendor/monteer/crates/isobmff" }
# decoder used as the round-trip oracle of wamda-opusenc (crates/export dev-dependency)
monteer-opus = { path = "vendor/monteer/crates/opus" }
monteer-vp9 = { path = "vendor/monteer/crates/vp9" }
# decoders used as the round-trip oracles of wamda-hevcenc / wamda-av1enc (dev-dependencies only)
monteer-hevc = { path = "vendor/monteer/crates/hevc" }
monteer-av1 = { path = "vendor/monteer/crates/av1" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
monteer-interchange = { path = "vendor/monteer/crates/interchange" }
monteer-project = { path = "vendor/monteer/crates/project" }
monteer-geom = { path = "vendor/monteer/crates/geom" }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
warsha-ui = { version = "0.1.0", path = "../../shared/warsha-libs/crates/ui", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against a Monteer checkout next to this repo: uncomment.
# [patch."https://github.com/malshatti44/warshaa"]
# monteer-codecs = { path = "../monteer/crates/codecs" }
# monteer-media = { path = "../monteer/crates/media" }
# monteer-frame = { path = "../monteer/crates/frame" }
# monteer-color = { path = "../monteer/crates/color" }
# monteer-time = { path = "../monteer/crates/time" }
# monteer-h264enc = { path = "../monteer/crates/h264enc" }
# monteer-prores = { path = "../monteer/crates/prores" }
# monteer-aac = { path = "../monteer/crates/aac" }
# monteer-isobmff = { path = "../monteer/crates/isobmff" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.wamda-raster]
opt-level = 3

[profile.dev.package.wamda-render]
opt-level = 3

[profile.dev.package.wamda-gpu]
opt-level = 3

[profile.dev.package.wamda-effects]
opt-level = 3

[profile.dev.package.wamda-track]
opt-level = 3

[profile.dev.package.wamda-path]
opt-level = 3

[profile.dev.package.wamda-media]
opt-level = 3

[profile.dev.package.wamda-opusenc]
opt-level = 3

[profile.dev.package.wamda-export]
opt-level = 3

[profile.dev.package.wamda-vp9enc]
opt-level = 3

[profile.dev.package.wamda-hevcenc]
opt-level = 3

[profile.dev.package.wamda-av1enc]
opt-level = 3

# Monteer codec hot loops (same settings as Monteer's own workspace).
[profile.dev.package.monteer-h264]
opt-level = 3

[profile.dev.package.monteer-h264enc]
opt-level = 3

[profile.dev.package.monteer-hevc]
opt-level = 3

[profile.dev.package.monteer-vp9]
opt-level = 3

[profile.dev.package.monteer-prores]
opt-level = 3

[profile.dev.package.monteer-dnx]
opt-level = 3

[profile.dev.package.monteer-av1]
opt-level = 3

[profile.dev.package.monteer-aac]
opt-level = 3

[profile.dev.package.monteer-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Arabic builds (ورشة): right-to-left rows and an Arabic fallback font in egui text.
[patch.crates-io]
epaint = { path = "../../shared/epaint" }
# Window titles with the Arabic app names, and the label hook (shared/egui).
egui = { path = "../../shared/egui" }
