[package]
name = "wamda-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wamda-time = { workspace = true }
wamda-geom = { workspace = true }
wamda-keyframe = { workspace = true }
serde_json = { workspace = true }
wamda-project = { workspace = true }
wamda-path = { workspace = true }
wamda-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
wamda-color = { workspace = true }
wamda-effects = { workspace = true }
wamda-text = { workspace = true }
