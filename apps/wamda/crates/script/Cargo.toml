[package]
name = "wamda-script"
description = "Wamda scripting: JavaScript (boa) with an After Effects-style object model (app, project, CompItem, Layer, Property…) over the engine's undoable commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wamda-engine = { workspace = true }
wamda-project = { workspace = true }
wamda-keyframe = { workspace = true }
wamda-time = { workspace = true }
wamda-render = { workspace = true }
wamda-path = { workspace = true }
serde_json = { workspace = true }
boa_engine = { workspace = true }
web-time = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
wamda-expr = { workspace = true }
wamda-psd = { workspace = true }
