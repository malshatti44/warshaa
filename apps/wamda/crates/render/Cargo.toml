[package]
name = "wamda-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wamda-time = { workspace = true }
wamda-geom = { workspace = true }
wamda-color = { workspace = true }
wamda-keyframe = { workspace = true }
wamda-project = { workspace = true }
wamda-raster = { workspace = true }
wamda-path = { workspace = true }
wamda-text = { workspace = true }
wamda-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
wamda-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
