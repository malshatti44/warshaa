[package]
name = "sada-ui-egui"
description = "Sada's egui user interface: Edit and Mix windows, transport, dialogs, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository.workspace = true

[dependencies]
warsha-ui.workspace = true
sada-time.workspace = true
sada-audio-io.workspace = true
sada-midi.workspace = true
sada-dsp.workspace = true
sada-clap-host.workspace = true
sada-vst3-host.workspace = true
sada-au-host.workspace = true
sada-model.workspace = true
sada-mix.workspace = true
sada-engine.workspace = true
sada-playback.workspace = true
sada-video.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[lints]
workspace = true

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Warsha (ورشة): the in-app AI assistant panel.
warsha-assistant = { path = "../../../../shared/assistant" }
