[package]
name = "satr-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Satr engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
satr-geom = { workspace = true }
satr-doc = { workspace = true }
satr-fonts = { workspace = true }
satr-layout = { workspace = true }
satr-render = { workspace = true }
satr-proof = { workspace = true }
satr-docx = { workspace = true }
satr-docbin = { workspace = true }
satr-pdf = { workspace = true }
satr-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
zip = { workspace = true }
