[package]
name = "minbar-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minbar renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
minbar-geom = { workspace = true }
minbar-color = { workspace = true }
minbar-model = { workspace = true }
minbar-fonts = { workspace = true }
minbar-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
