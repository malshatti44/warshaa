[package]
name = "minbar-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minbar egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
minbar-geom = { workspace = true }
minbar-color = { workspace = true }
minbar-model = { workspace = true }
minbar-fonts = { workspace = true }
minbar-text = { workspace = true }
minbar-render = { workspace = true }
minbar-anim = { workspace = true }
minbar-engine = { workspace = true }
minbar-media = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Warsha (ورشة): the in-app AI assistant panel.
warsha-assistant = { path = "../../../../shared/assistant" }
