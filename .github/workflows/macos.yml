# The macOS edition of Warsha (ورشة): each app as a universal (Apple silicon + Intel) DMG, and the
# suite (every app in one DMG). Ad-hoc signed: Warsha has no Apple Developer ID yet, so on first
# open macOS asks the user to allow the app (System Settings › Privacy & Security › Open Anyway).
#
# Run it from the Actions tab (Run workflow). With "upload", the DMGs and their checksums are
# attached to the release named by "release_tag".
name: macOS builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version the apps report and the file names carry
        default: "2.2.0"
      release_tag:
        description: Release to attach the DMGs to
        default: "v2.2.0"
      upload:
        description: Attach the DMGs to the release
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  # As the Windows build: the assistant reads Arabic scans, so Watheeq ships no OCR models.
  WARSHA_NO_OCR_MODELS: "1"

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: macos-14
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        app: [retoush, reesha, monteer, tayf, watheeq, wamda, nasaq, satr, minbar, kashf, mukhattat, sada, warsha]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}
          key: macos-${{ matrix.app }}

      - name: Window layout of the DMG
        run: |
          python3 -m venv /tmp/dmgpy
          /tmp/dmgpy/bin/pip install --quiet 'pillow>=12' ds_store==1.3.3 mac_alias==2.2.3
          /tmp/dmgpy/bin/python packaging/macos_dmg.py layout "apps/${{ matrix.app }}"

      - name: Build and package
        env:
          V: ${{ inputs.version }}
        run: |
          app="${{ matrix.app }}"
          if [ "$app" = warsha ]; then export WARSHA_LAUNCHER_VERSION="$V"; else export "$(echo "$app" | tr a-z A-Z)_VERSION=$V"; fi
          export DIST="$GITHUB_WORKSPACE/out"
          export CARGO_BUILD_JOBS=3
          bash "apps/$app/packaging/macos/package.sh" --arch universal

      - name: Check the app
        run: |
          app="${{ matrix.app }}"
          dmg="out/$app-${{ inputs.version }}-macos-universal.dmg"
          ls -la out
          test -f "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          bundle="$(ls -d "$mnt"/*.app | head -1)"
          echo "bundle: $bundle"
          ls -la "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          plutil -p "$bundle/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
          codesign --verify --strict --deep --verbose=2 "$bundle"
          for f in "$bundle"/Contents/MacOS/*; do lipo -info "$f"; done
          if [ "$app" != warsha ]; then
            test -x "$bundle/Contents/MacOS/$app-cli"
            "$bundle/Contents/MacOS/$app-cli" --version || "$bundle/Contents/MacOS/$app-cli" --help | head -5 || true
          fi
          if [ "$app" = satr ]; then ls "$bundle/Contents/Resources/dictionaries"; fi
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.app }}
          path: out/${{ matrix.app }}-${{ inputs.version }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 14

  suite:
    needs: app
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dmg

      - name: The suite DMG (every app)
        env:
          V: ${{ inputs.version }}
        run: |
          python3 -m venv /tmp/dmgpy
          /tmp/dmgpy/bin/pip install --quiet ds_store==1.3.3 mac_alias==2.2.3
          stage="$RUNNER_TEMP/suite"
          mkdir -p "$stage/.background"
          for f in dmg/*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$f"
            ditto "$(ls -d "$mnt"/*.app | head -1)" "$stage/$(basename "$(ls -d "$mnt"/*.app | head -1)")"
            hdiutil detach "$mnt"
          done
          ls "$stage"
          ln -s /Applications "$stage/Applications"
          cp packaging/macos/suite/background.tiff "$stage/.background/background.tiff"
          /tmp/dmgpy/bin/python packaging/macos_dmg.py suite-layout "$stage"
          out="dmg/Warsha-Suite-$V-macos-universal.dmg"
          hdiutil makehybrid -hfs -hfs-volume-name "Warsha" -hfs-openfolder "$stage" -o "$RUNNER_TEMP/raw.dmg" "$stage"
          hdiutil convert "$RUNNER_TEMP/raw.dmg" -format UDZO -imagekey zlib-level=9 -o "$out"
          codesign --force --sign - --timestamp=none "$out"
          (cd dmg && shasum -a 256 *.dmg > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt)
          ls -la dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dmg/*.dmg
            dmg/SHA256SUMS-macos.txt
          retention-days: 14

      - name: Attach to the release
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dmg/*.dmg dmg/SHA256SUMS-macos.txt --clobber --repo "$GITHUB_REPOSITORY"
