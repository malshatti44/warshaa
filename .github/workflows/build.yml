name: build
# اختبار دخان على كل دفعة، وبناء المثبّتات (ويندوز/ماك/لينكس) عند الطلب أو عند وسم إصدار.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      apps:
        description: 'التطبيقات (مفصولة بفواصل) أو all'
        default: 'all'
      release:
        description: 'إنشاء إصدار على GitHub بالملفات'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke test (Linux, Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Static checks
        run: |
          for f in $(git ls-files 'src/**/*.js' 'scripts/*.js'); do node --check "$f" || exit 1; done
      - name: Run every app in Electron and collect errors
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          WARSHA_SMOKE_DIR="$RUNNER_TEMP/smoke" xvfb-run -a npx electron . --smoke-test=all --no-sandbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke

  setup:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.m.outputs.apps }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          node -e '
            const r = require("./src/shared/registry.js");
            const want = (process.env.APPS || "all").trim();
            const all = ["hub"].concat(r.apps.map(a => a.id));
            const list = want === "all" ? all : want.split(",").map(s => s.trim()).filter(x => all.includes(x));
            console.log("apps=" + JSON.stringify(list));
            console.log("version=" + r.version);
          ' >> "$GITHUB_OUTPUT"
        env:
          APPS: ${{ github.event.inputs.apps }}

  build:
    needs: [setup]
    name: ${{ matrix.app }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        app: ${{ fromJSON(needs.setup.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build installer
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) P=--win ;;
            macOS) P=--mac ;;
            Linux) P=--linux ;;
          esac
          node scripts/build.js ${{ matrix.app }} $P
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_HARD_LINKS: 'false'
      - name: Smoke-test the packaged app
        shell: bash
        timeout-minutes: 10
        run: |
          set +e
          APP=${{ matrix.app }}
          T=$APP; [ "$APP" = hub ] && T=all
          PRODUCT=$(node -p "require('./dist/config-$APP.json').productName")
          export WARSHA_SMOKE_DIR="$RUNNER_TEMP/smoke-pkg"
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get install -y -qq xvfb > /dev/null
              BIN=$(find "dist/$APP/linux-unpacked" -maxdepth 1 -type f -name 'warsha*' -perm -u+x | head -1)
              xvfb-run -a "$BIN" --smoke-test=$T --no-sandbox ;;
            Windows)
              "dist/$APP/win-unpacked/$PRODUCT.exe" --smoke-test=$T ;;
            macOS)
              DIR=$(ls -d dist/$APP/mac-arm64 2>/dev/null || ls -d dist/$APP/mac)
              "$DIR/$PRODUCT.app/Contents/MacOS/$PRODUCT" --smoke-test=$T ;;
          esac
          STATUS=$?
          cat "$WARSHA_SMOKE_DIR/report.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).forEach(r=>console.log((r.ok?'PASS ':'FAIL ')+r.id+(r.ok?'':' '+r.errors.join(' | ')))))"
          exit $STATUS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.app }}/*.exe
            dist/${{ matrix.app }}/*.dmg
            dist/${{ matrix.app }}/*.AppImage
            dist/${{ matrix.app }}/*.deb

  release:
    needs: [setup, build]
    if: always() && needs.setup.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          ls -la out
          TAG="v$VERSION"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ورشة WARSHA $VERSION" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" out/* --clobber
