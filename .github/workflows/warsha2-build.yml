name: Warsha 2 — build one system

# Called by warsha2.yml once per system: builds the 13 Rust apps of Warsha 2 (apps/<repo>, with
# the patched egui/epaint in shared/) in parallel and uploads each binary as bin-<os>-<repo>.
#   linux:   x86_64 on Ubuntu 22.04 (glibc 2.35, so the packages run on newer distributions)
#   macos:   universal (Apple silicon + Intel, lipo), macOS 11 or newer
#   windows: x86_64-pc-windows-msvc with the C runtime linked statically, as packaging/build_release.sh

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  app:
    name: ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [photocraft, vectorcraft, filmcraft, lightcraft, pdfcraft, effectcraft, designcraft, wordcraft, deckcraft, gridcraft, cadcraft, soundcraft, craft-launcher]
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-22.04' || inputs.os == 'macos' && 'macos-14' || 'windows-2022' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ matrix.app }}
      OS: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/${{ matrix.app }}
            shared

      - name: Linux libraries
        if: inputs.os == 'linux'
        run: |
          # room for the larger apps (photocraft, filmcraft): drop toolchains this job doesn't use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libudev-dev libdbus-1-dev libssl-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev
          wait

      - name: NASM (aws-lc in pdfcraft)
        if: inputs.os == 'windows' && matrix.app == 'pdfcraft'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || inputs.os == 'windows' && 'x86_64-pc-windows-msvc' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }} -> ../../target
          key: ${{ matrix.app }}
          cache-on-failure: true

      - name: Build
        run: |
          PKG="$APP"; [ "$APP" = craft-launcher ] && PKG=artcraft-launcher
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT"
          cd "apps/$APP"
          case "$OS" in
            linux)
              cargo build --release -p "$PKG"
              cp "$CARGO_TARGET_DIR/release/$PKG" "$OUT/"
              strip "$OUT/$PKG"
              ;;
            macos)
              export MACOSX_DEPLOYMENT_TARGET=11.0
              cargo build --release -p "$PKG" --target aarch64-apple-darwin
              cargo build --release -p "$PKG" --target x86_64-apple-darwin
              lipo -create -output "$OUT/$PKG" \
                "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/$PKG" "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/$PKG"
              strip -x "$OUT/$PKG" || true
              lipo -info "$OUT/$PKG"
              ;;
            windows)
              export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS="-C target-feature=+crt-static"
              cargo build --release -p "$PKG" --target x86_64-pc-windows-msvc
              cp "$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/$PKG.exe" "$OUT/"
              ;;
          esac
          ls -la "$OUT"

      - name: Starts and reports its version
        if: inputs.os == 'linux'
        continue-on-error: true
        run: |
          PKG="$APP"; [ "$APP" = craft-launcher ] && PKG=artcraft-launcher
          timeout 60 "out/$PKG" --version

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ inputs.os }}-${{ matrix.app }}
          path: out/
          if-no-files-found: error
          retention-days: 14
