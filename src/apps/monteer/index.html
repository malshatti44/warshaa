<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مونتير</title>
  <link rel="stylesheet" href="../../shared/warsha.css">
  <link rel="stylesheet" href="monteer.css">
</head>
<body>
  <div class="w-app">
    <div class="w-menubar"></div>
    <div class="w-toolbar" id="toolbar"></div>
    <div class="w-main v-workspace">
      <aside class="v-bin" id="bin"></aside>
      <div class="v-center">
        <div class="v-previewbox" id="previewBox">
          <canvas id="preview" class="v-preview"></canvas>
        </div>
        <div class="v-controls" dir="ltr"><div class="v-ctl" id="controls"></div><div class="v-time" id="time">00:00:00 / 00:00:00</div></div>
        <div class="v-timeline" id="timeline" dir="ltr"></div>
      </div>
      <aside class="w-side v-props" id="props"></aside>
    </div>
    <div class="w-statusbar"></div>
  </div>
  <script src="../../shared/registry.js"></script>
  <script src="../../shared/icons.js"></script>
  <script src="../../shared/warsha.js"></script>
  <script src="../../shared/vendor/mp4-muxer.min.js"></script>
  <script src="../../shared/vendor/webm-muxer.min.js"></script>
  <script src="monteer.js"></script>
</body>
</html>
