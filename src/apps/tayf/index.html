<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طيف</title>
  <link rel="stylesheet" href="../../shared/warsha.css">
  <link rel="stylesheet" href="tayf.css">
</head>
<body>
  <div class="w-app">
    <div class="w-menubar"></div>
    <div class="w-toolbar" id="toolbar"></div>
    <div class="w-main">
      <div class="t-center">
        <div class="w-stage" id="stage"><canvas id="view"></canvas></div>
        <div class="t-strip" id="strip"></div>
      </div>
      <aside class="w-side t-side">
        <div class="w-panel">
          <div class="w-panel-title" data-i18n="y.histogram"></div>
          <div class="w-panel-body"><canvas id="hist" width="256" height="90"></canvas></div>
        </div>
        <div class="t-panel" id="panel"></div>
      </aside>
    </div>
    <div class="w-statusbar"></div>
  </div>
  <script src="../../shared/registry.js"></script>
  <script src="../../shared/icons.js"></script>
  <script src="../../shared/warsha.js"></script>
  <script src="../../shared/imgops.js"></script>
  <script src="tayf.js"></script>
</body>
</html>
